[package]
name = "podium-host"
version = "1.0.0"
edition = "2024"
description = "podium-host (SPEC-6): the durable process host behind every Podium session on Linux, macOS and Windows."
license = "Apache-2.0"
publish = false

[[bin]]
name = "podium-host"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
# Safe wrappers for the POSIX calls std does not cover: poll, pty, winsize
# ioctls, waitpid, kill, peer credentials, fd flags.
rustix = { version = "1", default-features = false, features = ["std", "event", "fs", "net", "process", "pty", "stdio", "termios"] }
# Only what rustix cannot offer safely: fork, sigaction, and macOS LOCAL_PEERCRED.
libc = "0.2"
[target.'cfg(windows)'.dependencies]
bitflags = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] }

[dependencies]
# The terminal emulator behind the `screen` feature (POD-4861 chose it).
alacritty_terminal = { version = "0.26", default-features = false, optional = true }

[features]
default = ["screen"]
# Keep the terminal's screen in the host and put pictures of it into the output
# stream (POD-4909). Without it the host is the plain SPEC-6 host (features=1).
screen = ["dep:alacritty_terminal"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
