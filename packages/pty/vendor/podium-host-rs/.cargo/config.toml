# rcodesign writes an LC_CODE_SIGNATURE load command into the Mach-O header; without
# reserved headroom the x86_64 link leaves no room for it and signing fails. Same flag
# scripts/host-cross.ts passes to `zig cc` for the C host.
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-headerpad,0x8000"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-headerpad,0x8000"]
