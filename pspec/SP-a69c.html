<section data-spec="SP-a69c" data-title="Repository-owned landing policy" data-parent="SP-root" data-order="32" data-status="draft" data-updated="1787156213544">
<p>Podium does not prescribe how repositories land or publish changes. Landing procedures belong to each repository; Podium may expose coordination and merge capabilities without injecting a mandatory workflow.</p>
</section>
