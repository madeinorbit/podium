<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Podium">
  <!--
    Android adaptive icon, FOREGROUND layer [POD-1108]. Pairs with
    android-icon-background.svg; the launcher composites the two and then masks
    the result to whatever shape the device uses (circle, squircle, teardrop…).

    Adaptive layers are 108dp and the launcher only promises the middle 66dp —
    a CIRCLE, not a square. Fitting the square and calling it done is what put
    the bowl of the P outside the crop on the first pass: at the bowl's height
    the circle is only ~430 wide where the square is 683, and the widest part of
    the letter sits exactly there.

    So the letter is sized off the circle instead: scale 2.55 about (518, 505)
    puts the bowl's outer edge ~14px inside the 341-radius safe circle. That is
    smaller than the straight 0.833 reduction of icon-maskable.svg would give,
    and deliberately so. The stem still runs off the top and bottom — that crop
    is the mark, not an accident (see icon.svg).

    The plane is placed to read the same way inside the circle as it does inside
    the frame of icon.svg: 89% down at the left of the visible area, 70% at the
    right. In full-frame coordinates that is a much thicker ocre wedge than
    icon.svg has, because most of it is outside the crop.

    The plane keeps its frame overrun on purpose. It is the ground the letter
    stands on, so it should meet the mask edge on every device rather than float
    as a bar inside a circle.
  -->
  <defs>
    <radialGradient id="s" cx="300" cy="220" r="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#eeeef1"/>
      <stop offset="1" stop-color="#b4b5bf"/>
    </radialGradient>
  </defs>
  <path d="M-40 818 L1064 608 L1064 1064 L-40 1064 Z" fill="#b87c14"/>
  <path transform="translate(518 505) scale(2.55) translate(-378.35 -383.8)" fill="url(#s)" d="M366.5 237.84C382.17 237.71 397.83 237.84 413.5 237.78C425.68 237.74 439.18 238.04 448.67 246.85C460.33 257.68 459.8 274.99 458.13 289.5C455.82 309.57 451.8 329.66 448.22 349.54C444.43 370.55 440.9 393.5 423.35 407.89C414.65 415.02 403.67 419.09 392.5 419.97C382.97 420.71 372.86 419.07 363.5 420.64C355.77 457.07 348.03 493.51 340.3 529.94C325.83 529.94 311.37 529.94 296.9 529.94C320.1 432.57 343.3 335.21 366.5 237.84ZM394.5 273.09C386.93 309.23 379.35 345.36 371.78 381.5C374.8 382.45 377.72 382.46 380.97 382.5C384.65 382.54 388.56 382.49 392.13 381.56C405.6 378.03 406.84 360.73 409.13 349.53C411.59 337.55 413.67 325.5 416.04 313.5C417.79 304.62 423.82 285.42 418.98 277.55C414.65 270.5 401.34 272.07 394.5 273.09Z"/>
</svg>
