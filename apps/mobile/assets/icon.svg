<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Podium">
  <!--
    The Podium mark, same geometry as the desktop app's
    apps/desktop/src-tauri/icons/app-icon.svg [POD-392]. Two differences, both
    forced by iOS: the art is FULL BLEED (iOS masks its own squircle, and a
    second set of rounded corners inside that mask reads as an icon floating in
    a black frame), and the desktop frame's 1px border is gone with it. The P
    keeps its original coordinates — iOS's mask lands within a few pixels of
    where the desktop frame was, so the margins read the same on both.

    Rasterise with `bun apps/mobile/scripts/generate-web-icons.ts`, which writes
    assets/icon.png (Expo's native + splash source) and the whole public/icons
    set from this file.
  -->
  <defs>
    <linearGradient id="surface" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20202a"/>
      <stop offset="1" stop-color="#0e0e12"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#surface)"/>
  <g>
