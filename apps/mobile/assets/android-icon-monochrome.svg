<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Podium">
  <!--
    Android adaptive icon, MONOCHROME layer [POD-1108] — what Material You
    tints to the user's wallpaper palette on Android 13+.

    Same geometry as android-icon-foreground.svg, drawn in white on nothing:
    the launcher takes the ALPHA of this layer and fills it with its own colour,
    so any colour committed here is discarded. Two values would be discarded
    with it, which is why the ocre plane is carried as 38% alpha instead — the
    plane has to stay a step behind the letter once both are the same hue, and
    alpha is the only channel that survives the tint.
  -->
  <path d="M-40 818 L1064 608 L1064 1064 L-40 1064 Z" fill="#ffffff" opacity=".38"/>
