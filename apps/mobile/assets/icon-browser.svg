<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Podium">
  <!--
    MOBILE'S COPY OF THE UNMASKED/BROWSER CUT. Browser tabs and PWA
    `purpose: any` slots render the pixels as-is, so this source clips the
    bisque tile to a rounded frame and leaves transparent corners. Keep its drawing
    byte-equivalent to apps/web/public/icon-browser.svg when the mark is recut.

    Native iOS and Apple touch icons continue to use icon.svg full bleed;
    Android maskable/adaptive slots continue to use their own safe-zone masters.
  -->
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="920" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#232019"/>
      <stop offset="1" stop-color="#0b0a08"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
