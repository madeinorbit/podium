[package]
name = "podium-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
# The executable FILENAME is the app name macOS shows for an unbundled process:
# the Dock tile, ⌘-Tab, and Activity Monitor all read ProcessInfo.processName,
# which is argv[0]'s basename. `tauri dev` runs this binary straight out of
# target/ with no .app around it, so a `podium-desktop` here is a Dock tile
# reading "podium-desktop". The packaged bundle was never affected — it reads
# CFBundleDisplayName/CFBundleName, which tauri.conf.json sets to "Podium ADE"
# — and `mainBinaryName` would not have helped, since that renames during
# `tauri build` only.
#
# This stays "Podium" rather than following the display name to "Podium ADE":
# cargo derives the crate name from the target name, so the target cannot
# contain a space, and a hyphenated "Podium-ADE" tile is a worse dev-only
# stand-in than the plain product word. Only `tauri dev` sees it.
name = "Podium"
path = "src/main.rs"

[lib]
name = "podium_desktop_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# WKWebView is opaque by default. Tauri's macOS private-API feature is the
# supported desktop-shell path for making it transparent so the native
# NSVisualEffectView material can show through the HTML title bar.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# Native SQLite for the web client's replica persistence (POD-789):
# TanStack DB's Tauri adapter drives this plugin from JS.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
# The native updater uses the same parsed SemVer fields as the Tauri plugin while
# applying Podium's explicit dev > edge prerelease tiers.
semver = "1"
# Required by tauri::generate_context! once plugins.updater config is embedded.
# Also renders the native NDJSON log records (src/logging.rs), which is why the
# escaping of a stack trace into a log line is somebody else's solved problem.
serde_json = "1"
# The logging FACADE only ([spec:2026-08-11-logging-strategy-design], chunk 5).
# Call sites say `log::warn!` and stay ignorant of the backend; the NDJSON sink
# in src/logging.rs is ours, because the record shape is the cross-runtime
# contract and every off-the-shelf backend wants to own the line format.
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Detect whether the installed bundle lives on a read-only volume before download.
# Darwin exposes the mount flag through statfs.
libc = "0.2"

[dev-dependencies]
# Integration tests (tests/) see only the crate and its DEV dependencies, never
# its ordinary ones — so the panic-hook runtime check needs its own serde_json
# to read back the NDJSON record it forced onto disk.
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
