<!doctype html>
<html lang="en" class="dark" data-theme="podium">
  <head>
    <script>
      // Apply the stored Podium appearance before React mounts so the first paint matches
      // (no flash). Keys/values mirror src/theme.tsx exactly.
      (() => {
        try {
          var BG = {
            dark: '#16171a',
            light: '#f2f1ed',
          }
          // Retire the old multi-preset preference. Podium now has one theme.
          localStorage.removeItem('podium.theme.preset')
          var m = localStorage.getItem('podium.theme.mode')
          var mode = m === 'light' || m === 'dark' || m === 'system' ? m : 'dark'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = mode === 'system' ? prefersDark : mode === 'dark'
          var el = document.documentElement
          // Experimental feature state arrives from the server after boot. Start
          // balanced so a dormant compact preference cannot flash before the gate resolves.
          el.dataset.density = 'balanced'
          var desktop = window.__PODIUM_DESKTOP__
          if (desktop && /^(macos|windows|linux)$/.test(desktop.platform)) {
            el.dataset.podiumDesktop = 'true'
            el.dataset.podiumPlatform = desktop.platform
            // Pre-paint native appearance sync (mirrors applyTheme in src/theme.tsx):
            // the macOS vibrancy layer follows the window's NSAppearance, not the
            // page theme; null hands system mode back to the OS. Feature-detected —
            // older shells have no setTheme.
            if (desktop.setTheme) desktop.setTheme(mode === 'system' ? null : mode)
          }
          el.setAttribute('data-theme', 'podium')
          el.classList.toggle('dark', isDark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', BG[isDark ? 'dark' : 'light'])
        } catch (e) {}
      })()
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Podium — agent workspace"
    />
    <meta name="theme-color" content="#16171a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Podium" />
    <!-- Full bleed: iOS supplies the squircle mask for this surface. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <title>Podium</title>
  </head>
  <body>
    <div
      id="app-start-fallback"
      role="alert"
      hidden
      style="box-sizing: border-box; width: 100%; padding: 16px; background: #2b2b31; color: #f7f7f9; font: 600 14px/1.5 ui-sans-serif, system-ui, sans-serif"
    >
      Podium’s app did not start.
      <button
        type="button"
        onclick="window.location.reload()"
        style="margin-left: 12px; border: 1px solid currentColor; border-radius: 6px; padding: 3px 10px; background: transparent; color: inherit; font: inherit; cursor: pointer"
      >
        Reload
      </button>
    </div>
    <script data-app-start-fallback-script>
      (() => {
        var fallback = document.getElementById('app-start-fallback')
        window.setTimeout(function () {
          if (fallback && fallback.isConnected) fallback.hidden = false
        }, 4000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
