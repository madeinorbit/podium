<!doctype html>
<!--
  The page for harness/usage-tasks-entry.tsx (POD-1861). Served at
  /harness/usage-tasks.html (vite's root is apps/web).

  THE THEME LIVES ON THE ROOT ELEMENT, for the reason the reset-ledger harness
  beside it records: `index.css` defines every colour token under
  `[data-theme="podium"]`, so a harness page without it resolves `--usage-rule`,
  `--live` and the rest to nothing — which for this section means an invisible
  divided group and an invisible share rail. `dark` matches the app default; the
  entry renders a Paper copy beside it so both themes are checked at once.
-->
<html lang="en" class="dark" data-theme="podium">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where it went — by task, harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/harness/usage-tasks-entry.tsx"></script>
  </body>
</html>
