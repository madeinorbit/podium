<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cached screen freshness</title></head>
  <body><div id="root"></div><script type="module">
    window.refreshingStage = 'import'
    import('./refreshing-entry.tsx').catch(error => {
      window.refreshingStage = String(error.stack ?? error)
      window.refreshingFailure = window.refreshingStage
      console.error(error)
    })
  </script></body>
</html>
