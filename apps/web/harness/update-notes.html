<!doctype html>
<!--
  The page for harness/update-notes-entry.tsx: the update panel with real release notes.
  Served at /harness/update-notes.html by `bunx vite --config vite.harness.config.ts` (port 55599).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { margin: 0; background: var(--background); color: var(--foreground); }
      .update-harness { max-width: 1080px; margin: 0 auto; padding: 28px 40px 64px; }
      .update-harness-heading { display: flex; align-items: start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      .update-harness-heading h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
      .update-harness-heading p { font-size: 12px; color: var(--muted-foreground); margin: 0; }
      .update-harness-heading button { border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 10px; background: var(--chip); font-size: 12px; cursor: pointer; white-space: nowrap; }
      .update-harness-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 448px)); justify-content: center; gap: 40px 56px; align-items: start; }
      .update-harness-frame { margin: 0; min-width: 0; }
      .update-harness-frame .update-card { position: relative; right: auto; bottom: auto; width: 100%; }
      .update-harness-frame figcaption { margin-top: 12px; font-size: 11.5px; color: var(--muted-foreground); }
      .update-harness-message { display: block; min-height: 20px; margin-top: 16px; font-size: 12px; color: var(--muted-foreground); }
      @media (max-width: 800px) { .update-harness { padding: 20px 16px; } .update-harness-grid { grid-template-columns: 1fr; } }
    </style>
    <title>Update panel review gallery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/harness/update-notes-entry.tsx"></script>
  </body>
</html>
