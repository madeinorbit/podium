<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Podium">
  <!--
    WEB'S COPY OF THE 9a SAFE-ZONE CUT [POD-1108, wired up here by POD-1109].
    Byte-for-byte the same art as apps/mobile/assets/icon-maskable.svg — keep it
    that way, and re-copy from there whenever the mark is recut. Web keeps its
    own copy of the masters for the same reason it keeps its own icon.svg: the
    two apps build from separate trees and nothing resolves across them at build
    time.

    This is the cut for masks that crop hard — the PWA `purpose: maskable` icon,
    which Android inscribes a circle into the middle 80% of.

    Not a scaled-down icon.svg. Two things move rather than shrink: the ocre
    plane is raised (912 -> 936 at the left edge) so the circle does not slice
    through it at a shallow angle, and the letter drops from scale 4.3 to 3.35
    so its shoulder and stem stay inside the crop. The frame-level overrun on
    the plane is KEPT — the circle is meant to cut the overrun, not the plane,
    which is also why this goes into the rasteriser FULL BLEED. Any padding
    would inset a tile that already owns its own margin and put back the border
    POD-1109 exists to remove.

    Rasterised by ./scripts/generate-maskable-icon.ts into the committed
    public/icon-maskable-512.png, which vite.config.ts names in the manifest.
    Never rasterise icon.svg for a maskable slot: full bleed art plus a hard
    crop is how the mark loses its shoulder.
  -->
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="920" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#232428"/>
      <stop offset=".6" stop-color="#131417"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="s" cx="300" cy="220" r="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#eeeef1"/>
      <stop offset="1" stop-color="#b4b5bf"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <path d="M-40 936 L1064 776 L1064 1064 L-40 1064 Z" fill="#b87c14"/>
  <path transform="translate(534 508) scale(3.35) translate(-378.35 -383.8)" fill="url(#s)" d="M366.5 237.84C382.17 237.71 397.83 237.84 413.5 237.78C425.68 237.74 439.18 238.04 448.67 246.85C460.33 257.68 459.8 274.99 458.13 289.5C455.82 309.57 451.8 329.66 448.22 349.54C444.43 370.55 440.9 393.5 423.35 407.89C414.65 415.02 403.67 419.09 392.5 419.97C382.97 420.71 372.86 419.07 363.5 420.64C355.77 457.07 348.03 493.51 340.3 529.94C325.83 529.94 311.37 529.94 296.9 529.94C320.1 432.57 343.3 335.21 366.5 237.84ZM394.5 273.09C386.93 309.23 379.35 345.36 371.78 381.5C374.8 382.45 377.72 382.46 380.97 382.5C384.65 382.54 388.56 382.49 392.13 381.56C405.6 378.03 406.84 360.73 409.13 349.53C411.59 337.55 413.67 325.5 416.04 313.5C417.79 304.62 423.82 285.42 418.98 277.55C414.65 270.5 401.34 272.07 394.5 273.09Z"/>
</svg>
