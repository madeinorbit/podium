<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Podium">
  <!--
    The Podium mark, "bisque" [POD-1427]. Same geometry as
    apps/mobile/assets/icon.svg and apps/desktop/src-tauri/icons/app-icon.svg.
    It RECOLOURS the 9a cut [POD-1108] and moves nothing — the plane, the
    letter and the frame overrun are exactly where 9a left them, which is why
    every derived cut below could be repainted rather than redrawn.

    Colours (dark cut): plane #b8944f, ground #232019 → #0b0a08, letter a FLAT
    #f5eddd. 9a lit its letter with a stone gradient and stood it on a saturated
    amber; bisque is one warm family end to end, so the letter reads as ceramic
    sitting on the ground rather than as a highlight struck across it. Dropping
    the letter gradient is deliberate: at 16px the ramp only ever resolved to a
    slightly dirty white.

    The light cut of the same art (ground #fbf6ee → #ecdfc9, plane #d9b477,
    letter #171410) exists in the design project and is wired to nothing here.
    Every platform surface in this repo ships ONE icon and it is the dark one —
    an app icon does not follow the OS theme, and the About tile deliberately
    stays dark in the light appearance for the same reason.

    Not to be confused with the THEME accent, which POD-1431 also moved to
    bisque: that one is #d9b477, this icon's LIGHT-cut plane, used as the app's
    accent on both appearances. The dark cut painted here keeps #b8944f.

    FULL BLEED, for the same reason the mobile icon is: iOS masks its own
    squircle over an apple-touch-icon, and a second set of rounded corners
    inside that mask reads as an icon floating in a black frame.
    pwa-assets.config.ts therefore overrides the preset's default padding —
    left alone, it inserts the mark at 40% inside a WHITE square, which is what
    shipped before [POD-421].

    The ocre plane deliberately overruns the frame on all three sides (-40 to
    1064). A plane that stopped short of the edge would read as a bar again,
    and the overrun is what survives the platform masks: iOS's squircle,
    Android's circle and the macOS corner all cut into the overrun rather than
    into the plane's own edge.

    This is now only a platform-masked source. The committed Apple touch PNG is
    rasterised from it by scripts/generate-maskable-icon.ts; native iOS uses the
    matching mobile copy. Browser favicons and `purpose: any` PWA icons use
    icon-browser.svg so their transparent rounded corners are visible.
  -->
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="920" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#232019"/>
      <stop offset="1" stop-color="#0b0a08"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <path d="M-40 912 L1064 712 L1064 1064 L-40 1064 Z" fill="#b8944f"/>
  <path transform="translate(545 512) scale(4.3) translate(-378.35 -383.8)" fill="#f5eddd" d="M366.5 237.84C382.17 237.71 397.83 237.84 413.5 237.78C425.68 237.74 439.18 238.04 448.67 246.85C460.33 257.68 459.8 274.99 458.13 289.5C455.82 309.57 451.8 329.66 448.22 349.54C444.43 370.55 440.9 393.5 423.35 407.89C414.65 415.02 403.67 419.09 392.5 419.97C382.97 420.71 372.86 419.07 363.5 420.64C355.77 457.07 348.03 493.51 340.3 529.94C325.83 529.94 311.37 529.94 296.9 529.94C320.1 432.57 343.3 335.21 366.5 237.84ZM394.5 273.09C386.93 309.23 379.35 345.36 371.78 381.5C374.8 382.45 377.72 382.46 380.97 382.5C384.65 382.54 388.56 382.49 392.13 381.56C405.6 378.03 406.84 360.73 409.13 349.53C411.59 337.55 413.67 325.5 416.04 313.5C417.79 304.62 423.82 285.42 418.98 277.55C414.65 270.5 401.34 272.07 394.5 273.09Z"/>
</svg>
