<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Podium">
  <!--
    The Podium mark, the same geometry as apps/mobile/assets/icon.svg and
    apps/desktop/src-tauri/icons/app-icon.svg [POD-392]. It replaces an older
    angular lectern glyph that only this app still wore, so the browser tab, the
    installed PWA and an iPhone home screen now show the same P as the macOS app
    and the mobile shell [POD-421].

    FULL BLEED, for the same reason the mobile icon is: iOS masks its own
    squircle over an apple-touch-icon, and a second set of rounded corners inside
    that mask reads as an icon floating in a black frame. pwa-assets.config.ts
    therefore overrides the preset's default padding — left alone, it inserts the
    mark at 40% inside a WHITE square, which is what shipped before.

    Everything under public/ is copied verbatim into the dist, so this file is
    also the `<link rel="icon" type="image/svg+xml">` the browser tab uses. The
    PNG set (favicon.ico, pwa-*, maskable-*, apple-touch-icon-180x180) is
    rasterised from it at build time by vite-plugin-pwa; none of it is committed.
  -->
  <defs>
    <linearGradient id="surface" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20202a"/>
      <stop offset="1" stop-color="#0e0e12"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#surface)"/>
  <g>
