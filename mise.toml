# Runtime and build toolchain pins — the ONE place these versions are spelled.
#
# zig links the cross-built Rust binaries through cargo-zigbuild (the process host,
# scripts/rust-host-cross.ts, and podium-tunnel, scripts/tunnel-cross.ts), cross-compiles
# the abduco attach client kept to adopt sessions older releases started
# (scripts/abduco-cross.ts), and rcodesign re-signs Darwin Mach-Os with Bun's JIT
# entitlements (scripts/build-bun.ts). Both change the bytes a release ships, so they
# are pinned; scripts/tool-pins.ts reads this file and resolveZig/resolveRcodesign
# refuse a mismatched local install. CI installs from this file too (jdx/mise-action in
# .github/workflows/release.yml), so a bump here is the whole bump — re-run the Darwin
# assertions when you make one.
#
# pigz is here for INSTALL convenience, not enforcement: it parallelises release-tarball
# compression (scripts/parallel-gzip.ts) but stays optional at build time — a host without
# it falls back to gzip, and resolvePigz never version-checks. The conda backend is used
# because pigz publishes no binaries anywhere else; conda-forge ships it for linux and mac.
#
# Bun is selected before installs, tests and builds. Keep package.json packageManager
# synchronized; CI reads this file instead of carrying a separate Bun pin.
#
# Dev setup: `mise install` (https://mise.jdx.dev), or install the exact versions by hand.

# Linked updater worktrees must inherit trust from the main checkout.
# Verified with this mise release; 2026.5.3 prompts separately for every snapshot.
min_version = "2026.9.11"

[tools]
bun = "1.4.2"
zig = "0.16.0"
"github:indygreg/apple-platform-rs" = { version = "apple-codesign/0.29.0", exe = "rcodesign" }
"conda:pigz" = "2.8"
# podium-tunnel (native/podium-tunnel, POD-4640): Rust, cross-linked with the pinned zig
# through cargo-zigbuild (scripts/tunnel-cross.ts). Keep `rust` in step with the crate's
# rust-toolchain.toml.
rust = "1.96.1"
"github:rust-cross/cargo-zigbuild" = "0.23.4"
