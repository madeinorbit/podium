# Bun configuration — https://bun.sh/docs/runtime/bunfig
# Workspace packages are symlinked into node_modules automatically.
[install]
exact = false
# Strict isolated linking keeps each workspace's dependency boundary visible:
# undeclared imports fail in their owner instead of falling through a root hoist.
# The global store shares package bytes while workspace links remain owner-local.
linker = "isolated"
globalStore = true
linkWorkspacePackages = true
auto = "disable"
hoist = false

[test]
# Strip the ambient Podium agent-session env before every `bun test` file so a suite run
# from inside a live session can't touch/be hijacked by the live instance (POD-555
# [spec:SP-b85a]). vitest gets the same file via vitest.config.ts `setupFiles`.
# test-hermetic-env.ts is process-wide (preload evaluates once); test-hermetic-bun-hooks.ts
# remints a per-file TMPDIR + PODIUM_STATE_DIR on each Bun.main boundary so multi-file
# invocations do not share roots (POD-553).
preload = ["./test-hermetic-env.ts", "./test-hermetic-bun-hooks.ts"]
