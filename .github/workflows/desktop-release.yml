name: desktop release

# Desktop releases are explicit promotions, never a side effect of pushing main. [spec:SP-7f2c]
# Pushing a version tag IS that explicit promotion — one deliberate act, not a per-push build —
# so it releases without a second manual dispatch. The tag picks the channel:
#   v0.2.0          → stable
#   v0.2.0-edge.1   → edge
# Dispatch remains for re-promoting a commit without minting a new tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to promote
        required: true
        type: choice
        options:
          - edge
          - stable
          # A shell for trying a build. Published exactly like edge, onto its own standing
          # `dev` release, so it never reaches an install following edge or stable. Only a
          # source server on the dev channel hands this build out.
          - dev
      release_tag:
        description: Stable tag (vX.Y.Z); required for stable and ignored for edge and dev
        required: false
        type: string
      release_notes:
        description: "Optional updater notes shown in the update prompt (cannot force an update)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    # Resolved once here and consumed by every later job. Deriving the channel in each job's
    # `if:`/`env:` expressions instead invites the classic Actions ternary bug: an empty input
    # is falsy, so `dispatch && inputs.release_tag || github.ref_name` silently yields "main"
    # for an edge dispatch. Shell, run once, is legible and testable.
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      stable_tag: ${{ steps.resolve.outputs.stable_tag }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      target_tag: ${{ steps.validate.outputs.target_tag }}
      build_shell: ${{ steps.shell.outputs.build_shell }}
      shell_input_hash: ${{ steps.shell.outputs.shell_input_hash }}
    steps:
      - name: Resolve channel and ref
        id: resolve
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            channel="$INPUT_CHANNEL"
            stable_tag="$INPUT_RELEASE_TAG"
            # Stable builds the immutable release tag; edge and dev build the ref selected in
            # the UI, making the promoted source commit explicit.
            if [ "$channel" = stable ]; then checkout_ref="$stable_tag"; else checkout_ref="$GITHUB_REF"; fi
          else
            # A prerelease tag naming the edge channel promotes to edge; every other version tag
            # is a stable cut. Anything else is a tag we do not know how to release.
            # No tag promotes to dev: a dev shell is a disposable build of whatever is being
            # tried, always dispatched by hand against that ref.
            case "$GITHUB_REF_NAME" in
              *-edge.*) channel=edge;   stable_tag="" ;;
              *-*)      echo "tag $GITHUB_REF_NAME is a prerelease but names no channel" >&2; exit 1 ;;
              *)        channel=stable; stable_tag="$GITHUB_REF_NAME" ;;
            esac
            checkout_ref="$GITHUB_REF"
          fi
          if [ "$channel" = stable ] && [ -z "$stable_tag" ]; then
            echo "stable release needs a vX.Y.Z tag" >&2; exit 1
          fi
          if [ "$channel" != stable ] && [ "$channel" != edge ] && [ "$channel" != dev ]; then
            echo "unknown channel '$channel'" >&2; exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$stable_tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "releasing $channel from $checkout_ref"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}
      - uses: useblacksmith/setup-bun@v1
        with: { bun-version: '1.3.14' }
      - name: Validate release selection
        id: validate
        env:
          CHANNEL: ${{ steps.resolve.outputs.channel }}
          RELEASE_TAG: ${{ steps.resolve.outputs.stable_tag }}
          # A tag-driven release must agree with the version it claims to ship: the tag names the
          # release, package.json names what the updater sees. Disagreement means a manifest that
          # advertises a version nobody can install.
          TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "$TAG_NAME" ]; then
            version="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
            if [ "$TAG_NAME" != "v$version" ]; then
              echo "tag $TAG_NAME does not match package.json version $version" >&2
              exit 1
            fi
          fi
          bun scripts/desktop-release.ts --validate-only --channel "$CHANNEL" --tag "$RELEASE_TAG"
          # The release this promotion uploads to, taken from the script that wrote it into every
          # manifest URL rather than re-derived here. Two places deciding which tag a channel
          # publishes to is how a dev build ends up on the tag real installs follow.
          target_tag="$(bun scripts/desktop-release.ts --print-tag --channel "$CHANNEL" --tag "$RELEASE_TAG")"
          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "$CHANNEL publishes to release $target_tag"
      - name: Compare desktop shell inputs
        id: shell
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.resolve.outputs.channel }}
          TARGET_TAG: ${{ steps.validate.outputs.target_tag }}
        run: |
          set -euo pipefail
          shell_input_hash="$(git ls-files -s apps/desktop/src-tauri apps/desktop/scripts/stage-sidecar.ts | sha256sum | cut -d " " -f 1)"
          mkdir -p "$RUNNER_TEMP/standing-shell"
          # A moving channel compares against the shell standing on its OWN release. Reading
          # another channel's hash would let a dev promotion match edge's shell and skip the
          # build, leaving the dev release empty while the run reports success.
          if [ "$CHANNEL" = edge ] || [ "$CHANNEL" = dev ]; then
            gh release download "$TARGET_TAG" --pattern desktop-shell-input.sha256 --dir "$RUNNER_TEMP/standing-shell" || true
          else
            gh release download --pattern desktop-shell-input.sha256 --dir "$RUNNER_TEMP/standing-shell" || true
          fi
          standing=""
          if [ -f "$RUNNER_TEMP/standing-shell/desktop-shell-input.sha256" ]; then
            standing="$(tr -d "[:space:]" < "$RUNNER_TEMP/standing-shell/desktop-shell-input.sha256")"
          fi
          if [ "$standing" = "$shell_input_hash" ]; then build_shell=false; else build_shell=true; fi
          echo "build_shell=$build_shell" >> "$GITHUB_OUTPUT"
          echo "shell_input_hash=$shell_input_hash" >> "$GITHUB_OUTPUT"
          echo "desktop shell inputs changed: $build_shell"

  build:
    needs: validate
    if: needs.validate.outputs.build_shell == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: blacksmith-4vcpu-ubuntu-2204
            build_args: ""
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - target: windows-x86_64
            runner: windows-latest
            build_args: "-- --bundles nsis"
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
              apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          - target: darwin-aarch64
            runner: blacksmith-6vcpu-macos-15
            build_args: "-- --target aarch64-apple-darwin"
            bundle_dir: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
            artifact_paths: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          # Intel macs build natively on a GitHub-hosted Intel runner (Blacksmith's macOS fleet is
          # Apple Silicon only). Cross-compiling from arm64 would also need an x64 Bun sidecar and
          # an x64 abduco, neither of which build-bun plumbs through.
          - target: darwin-x86_64
            runner: macos-15-intel
            build_args: "-- --target x86_64-apple-darwin"
            bundle_dir: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle
            artifact_paths: |
              apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout_ref }}
      # The Blacksmith wrappers assume Blacksmith infrastructure; the GitHub-hosted Intel mac
      # leg uses the upstream actions instead.
      - uses: useblacksmith/setup-bun@v1
        if: startsWith(matrix.runner, 'blacksmith-')
        with: { bun-version: '1.3.14' }
      - uses: oven-sh/setup-bun@v2
        if: ${{ !startsWith(matrix.runner, 'blacksmith-') }}
        with: { bun-version: '1.3.14' }
      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - uses: useblacksmith/cache@v5
        if: startsWith(matrix.runner, 'blacksmith-')
        with:
          path: |
            ~/.bun/install/cache
            packages/agent-bridge/src/abduco.bin
          key: desktop-build-${{ matrix.target }}-${{ hashFiles('bun.lock', 'apps/desktop/src-tauri/Cargo.lock') }}
      - uses: actions/cache@v4
        if: ${{ !startsWith(matrix.runner, 'blacksmith-') }}
        with:
          path: |
            ~/.bun/install/cache
            packages/agent-bridge/src/abduco.bin
          key: desktop-build-${{ matrix.target }}-${{ hashFiles('bun.lock', 'apps/desktop/src-tauri/Cargo.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      # The Developer ID lives in a throwaway keychain rather than being handed to Tauri via
      # APPLE_CERTIFICATE, because stage-sidecar.ts signs the bundled sidecar BEFORE `tauri build`
      # runs — Tauri's own import happens too late for that step to find the identity.
      - name: Import Developer ID certificate
        if: startsWith(matrix.target, 'darwin-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/podium-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert="$RUNNER_TEMP/certificate.p12"
          # openssl rather than base64(1): the BSD and GNU tools disagree on the decode flag, and
          # -A accepts the secret whether or not it was pasted with line wrapping.
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          # Without disabling the inactivity lock the keychain relocks mid-build and signing fails
          # partway through with an unhelpful errSecInternalComponent.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$cert"
          security find-identity -v -p codesigning "$keychain"
      - name: Stage App Store Connect API key
        if: startsWith(matrix.target, 'darwin-')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # The literal contents of Apple's AuthKey_<KEYID>.p8 — PEM, headers included.
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          # A key pasted without its PEM header, or truncated before the footer, is unparseable —
          # but notarytool only says so after the build has already spent minutes compiling.
          head -1 "$key_path" | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "APPLE_API_KEY_CONTENT is not a PEM private key (missing BEGIN line)" >&2; exit 1; }
          grep -q 'END PRIVATE KEY' "$key_path" \
            || { echo "APPLE_API_KEY_CONTENT is truncated (missing END line). Its interactive
          prompt reads a SINGLE line, so pasting a multi-line PEM there keeps only the header.
          Set it from the file instead: gh secret set APPLE_API_KEY_CONTENT < AuthKey_KEYID.p8" >&2; exit 1; }
          openssl pkey -in "$key_path" -noout \
            || { echo "APPLE_API_KEY_CONTENT is not a valid private key" >&2; exit 1; }
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build signed desktop bundle
        env:
          # Empty on Linux: stage-sidecar.ts and Tauri both treat an unset identity as "not macOS
          # signing", and the `secrets` context is unavailable in `strategy`, so the split is here.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_TEAM_ID || '' }}
          # Presence of these three is what makes Tauri notarize and staple rather than only sign.
          APPLE_API_KEY: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_API_ISSUER || '' }}
          # Compile the resolved promotion channel into the installed shell so a pristine config
          # checks the feed this artifact actually came from.
          PODIUM_DESKTOP_RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --cwd apps/desktop build ${{ matrix.build_args }}
      # Tauri notarizes the .app and then builds the DMG around it, leaving the disk image itself
      # unnotarized — and the DMG is what users download and what carries the quarantine flag.
      - name: Notarize and staple the DMG
        if: startsWith(matrix.target, 'darwin-')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash apps/desktop/scripts/notarize-dmg.sh "${{ matrix.bundle_dir }}"
      # A release that reaches users unsigned or un-notarized is worse than a failed build, and
      # every failure mode here is silent in `tauri build` output. Gate the upload on proof.
      - name: Verify macOS signing and notarization
        if: startsWith(matrix.target, 'darwin-')
        run: bash apps/desktop/scripts/verify-macos-signing.sh "${{ matrix.bundle_dir }}"
      - name: Remove signing credentials
        if: always() && startsWith(matrix.target, 'darwin-')
        run: |
          security delete-keychain "$RUNNER_TEMP/podium-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/certificate.p12"
      - name: Stage desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, build]
    if: needs.validate.outputs.build_shell == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout_ref }}
      - uses: useblacksmith/setup-bun@v1
        with: { bun-version: '1.3.14' }
      - name: Collect promoted desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist-desktop-input
      - name: Prepare and validate static updater manifest
        env:
          CHANNEL: ${{ needs.validate.outputs.channel }}
          RELEASE_TAG: ${{ needs.validate.outputs.stable_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: >-
          bun scripts/desktop-release.ts
          --channel "$CHANNEL"
          --tag "$RELEASE_TAG"
          --notes "$RELEASE_NOTES"
          --bundle-dir dist-desktop-input
      - name: Record desktop shell input hash
        env:
          SHELL_INPUT_HASH: ${{ needs.validate.outputs.shell_input_hash }}
        run: printf "%s\n" "$SHELL_INPUT_HASH" > dist-desktop/desktop-shell-input.sha256
      - name: Upload promoted desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          TARGET_TAG: ${{ needs.validate.outputs.target_tag }}
        run: |
          set -euo pipefail
          target_tag="$TARGET_TAG"
          # Dev has no headless counterpart — nothing else ever creates or moves this release —
          # so this workflow owns it. `--prerelease` is load-bearing: a release marked latest
          # becomes what `releases/latest/download/...` resolves to, and that is the URL every
          # STABLE install reads its manifest from.
          if [ "$CHANNEL" = dev ]; then
            sha="$(git rev-parse HEAD)"
            notes="Rolling desktop shell for the dev channel, built from $sha.
          Served only to a source server on the dev channel; never offered to an edge or stable install."
            if gh release view "$target_tag" >/dev/null 2>&1; then
              # Move the standing tag onto the commit these assets were built from. Left where
              # the first promotion put it, the release page would name a source it no longer
              # carries — a build claiming to be something it is not.
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/$target_tag" -f "sha=$sha" -F force=true
              gh release edit "$target_tag" --prerelease \
                --title "dev (desktop shell)" --notes "$notes"
            else
              echo "creating standing $target_tag release from $sha"
              gh release create "$target_tag" --target "$sha" --prerelease \
                --title "dev (desktop shell)" --notes "$notes"
            fi
          fi
          # The same tag push starts the headless release workflow, which is what CREATES this
          # release. Desktop builds far longer than headless, so the release is normally already
          # there — but "normally" is not a guarantee, and failing here would throw away a
          # notarized build over a few seconds of ordering.
          for attempt in $(seq 1 60); do
            if gh release view "$target_tag" >/dev/null 2>&1; then break; fi
            echo "waiting for release $target_tag to exist (attempt $attempt/60)"
            sleep 30
          done
          gh release view "$target_tag" >/dev/null
          gh release upload "$target_tag" dist-desktop/* --clobber
          # Edge and dev are rolling releases, and DMG/AppImage names embed the version, so
          # --clobber never replaces them: every past build keeps offering its (possibly
          # pre-notarization) installer. Prune desktop assets this upload did not replace —
          # after the upload, so a failed publish leaves the previous build downloadable.
          # Headless assets on the same release belong to the other workflow and are kept.
          if [ "$CHANNEL" = edge ] || [ "$CHANNEL" = dev ]; then
            gh release view "$target_tag" --json assets --jq '.assets[].name' \
              | bun scripts/desktop-release.ts --list-stale --manifest dist-desktop/latest.json \
              | while IFS= read -r asset; do
                  echo "pruning stale $CHANNEL desktop asset $asset"
                  gh release delete-asset "$target_tag" "$asset" --yes
                done
          fi
