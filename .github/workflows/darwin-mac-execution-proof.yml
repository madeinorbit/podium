# POD-2520: run the Linux-cross-built Darwin headless payload on real macOS runners.
#
# workflow_dispatch only — this is NOT a per-release gate. The whole point of spec
# section 8b is that no Mac sits in the per-release build loop; this job exists so the
# EXECUTION proof can be re-run on demand (after a Bun bump, an abduco rebuild, or a
# change to the signing step) without waiting for a physical Mac.
#
# The runner labels are the ones apps/desktop already releases on:
#   blacksmith-6vcpu-macos-15  (Apple Silicon, macOS 15)
#   macos-15-intel             (Intel, macOS 15)
#
# Note: workflow_dispatch only resolves workflows that exist on the default branch, so
# this file has to be merged to main before the Run-workflow button appears. Until then,
# add a temporary `push:` trigger for your branch (see the commented block).
name: darwin-mac-execution-proof
on:
  workflow_dispatch:
  # Temporary bootstrap trigger: workflow_dispatch cannot resolve this workflow
  # until it lands on the default branch.
  push:
    branches: ['issue/2520-mac-execution-proof-for-cross-built-payl']
concurrency:
  group: darwin-mac-execution-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: '0.16.0'
  APPLE_CODESIGN_VERSION: '0.29.0'
  BUN_VERSION: '1.3.14'

jobs:
  build-linux:
    name: Cross-build + assert on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-rcodesign-${{ env.APPLE_CODESIGN_VERSION }}-${{ runner.os }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Install zig + rcodesign
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          sudo ln -sfn "/opt/zig-x86_64-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version
          command -v rcodesign >/dev/null \
            || cargo install apple-codesign --locked --bin rcodesign --version "${APPLE_CODESIGN_VERSION}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rcodesign --version

      - name: bun install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cross-compile abduco + podium
        run: |
          set -euo pipefail
          chmod +x scripts/spike/build-prebuilt-abduco.sh
          scripts/spike/build-prebuilt-abduco.sh
          bun --conditions=@podium/source scripts/spike/build-bun-darwin.ts --target=bun-darwin-arm64
          PLATFORM=darwin-arm64 scripts/spike/package-mac-execution-bundle.sh
          bun --conditions=@podium/source scripts/spike/build-bun-darwin.ts --target=bun-darwin-x64
          PLATFORM=darwin-x64 scripts/spike/package-mac-execution-bundle.sh

      # The asserter's PASS only means something if it can go red. Both run here:
      # a green assert with a red prove-it-can-fail is a broken instrument.
      - name: Assert the shipped tarballs (arm64 + x64)
        run: |
          set -euo pipefail
          scripts/spike/linux-assert-darwin-spike.sh dist-bun-spike/darwin-arm64 darwin-arm64
          scripts/spike/linux-assert-darwin-spike.sh dist-bun-spike/darwin-x64 darwin-x64

      - name: Prove the asserter can fail (negative controls)
        run: |
          set -euo pipefail
          mkdir -p dist-bun-spike/fixtures
          cp scripts/prebuilt/abduco/darwin-arm64/abduco /tmp/abduco.darwin.bak
          cp /bin/true scripts/prebuilt/abduco/darwin-arm64/abduco
          bun --conditions=@podium/source scripts/spike/build-bun-darwin.ts --target=bun-darwin-arm64
          tar -czf dist-bun-spike/fixtures/linux-abduco-embedded.tar.gz \
            -C dist-bun-spike/darwin-arm64 headless
          cp /tmp/abduco.darwin.bak scripts/prebuilt/abduco/darwin-arm64/abduco
          bun --conditions=@podium/source scripts/spike/build-bun-darwin.ts --target=bun-darwin-arm64
          PLATFORM=darwin-arm64 scripts/spike/package-mac-execution-bundle.sh
          scripts/spike/prove-assert-can-fail.sh | tee prove-assert-can-fail.log

      - uses: actions/upload-artifact@v4
        with:
          name: mac-execution-bundles
          path: |
            dist-bun-spike/mac-execution-bundle-darwin-arm64.tar.gz
            dist-bun-spike/mac-execution-bundle-darwin-x64.tar.gz
            prove-assert-can-fail.log
          retention-days: 30

  verify-macos:
    name: Execute on ${{ matrix.label }}
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            platform: darwin-arm64
            label: Apple Silicon (macOS 15)
          - runner: macos-15-intel
            platform: darwin-x64
            label: Intel (macOS 15)
    # fail-fast is off: the arm64 leg is the decisive one, and an Intel failure
    # must not hide an Apple Silicon pass (or the reverse).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-execution-bundles
      - name: Unpack and run the execution proof
        run: |
          set -euo pipefail
          uname -a
          tar -xzf "dist-bun-spike/mac-execution-bundle-${{ matrix.platform }}.tar.gz"
          cd "mac-execution-bundle-${{ matrix.platform }}"
          chmod +x verify-on-mac.sh podium-cli.nosig
          bash verify-on-mac.sh | tee "../verify-${{ matrix.platform }}.log"
      - name: Hard gates
        run: |
          set -euo pipefail
          log="verify-${{ matrix.platform }}.log"
          grep -q 'PASS  version: podium-cli --version runs' "$log"
          grep -q 'PASS  codesign: --verify --strict accepts' "$log"
          grep -q 'PASS  entitlements: allow-jit present' "$log"
          grep -q 'PASS  daemon: all-in-one boot' "$log"
          grep -q 'PASS  abduco: embedded helper materialized' "$log"
          grep -q 'PASS  abduco: session survives daemon kill' "$log"
          grep -q 'RESULT: PASS' "$log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ matrix.platform }}-log
          path: verify-${{ matrix.platform }}.log
          retention-days: 90
