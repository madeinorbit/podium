name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Fast jobs install with --ignore-scripts (same rationale as release.yml): node-pty's
# node-gyp postinstall crash-loops on CI runner toolchains, and nothing they run needs
# it — the unit scope (vitest.unit.config.ts) excludes every suite that actually
# spawns a PTY/abduco/real server. The oracle job below is the exception: it runs the
# process-spawning lanes, so it installs with scripts and real system deps.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      # Non-blocking for now: ~249 pre-existing biome errors are being burned down
      # separately (podium #30). Flip this to blocking once the count reaches zero.
      - name: biome + boundaries (non-blocking)
        continue-on-error: true
        run: bun run lint
      # BLOCKING, and deliberately its own step: the lint step above is
      # continue-on-error, so a ratchet folded into `bun run lint` would report
      # green forever. The v3 rewrite may not grow the debt it is deleting
      # (POD-297) — see docs/rearch-deletion-audit.md.
      - name: deletion audit ratchet (rearchitecture v3)
        run: bun run audit:rearch

      # BLOCKING, its own step, for the same reason as the ratchet above — and
      # POD-1669 is the proof it was needed. This gate went RED ON MAIN and
      # nobody knew, because nothing ran it: the count of places assuming the
      # sole account rose by five while the product shipped MULTI-USER. An
      # instrument nobody reads is not a gate (the POD-1369 class).
      #
      # This lane and not another: it is a ratchet over source, exactly like
      # `audit:rearch` — no database, no server, no fixtures, seconds to run —
      # and the lint job is where the repo already keeps its blocking ratchets.
      # It must NOT be folded into `bun run lint`, which is continue-on-error
      # while biome's backlog burns down (#30); that is how POD-744 reported
      # green for weeks while exiting 1, and it is how this gate went dark.
      #
      # The script self-probes before it measures, so a green here also means
      # the instrument demonstrated it can still say no.
      - name: ambient-principal ratchet (multi-user)
        run: bun run audit:ambient-principals

      # BLOCKING, and deliberately its own step rather than folded into the
      # `bun run lint` bundle above: that one is continue-on-error while biome's
      # backlog is burned down (#30), and POD-744 is the cautionary tale — a
      # guardrail bundled under a swallowed red reported green for weeks while
      # exiting 1.
      #
      # POD-335 dropped `--manifest-only`. That flag existed because the legacy
      # rule family was red (POD-740's four agent-host-consumers violations) and
      # the manifest had to be blockable without them. Both halves are green now:
      # the eight legacy rules are RETIRED against manifest equivalents, the
      # allowlist is EMPTY, and every manifest rule runs at error level. So the
      # whole boundary lint blocks, which is the end state POD-296 was aiming at.
      - name: dependency boundaries + architecture manifest (error level, no allowlist)
        run: bun run lint:boundaries
      # The layer diagram in ARCHITECTURE.md is RENDERED from the same manifest
      # the lint reads. Without this step a hand edit is silently lost at the
      # next render, which is how the two sources drifted apart in the first
      # place (the old block still called @podium/protocol a leaf).
      - name: ARCHITECTURE.md layer diagram is not stale
        run: bun run docs:layers:check

  # [POD-758] Own blocking job — never fold into the continue-on-error lint
  # bundle above. A raw NUL makes the file binary: real grep is loud, but
  # -n/rg line extraction loses parseable hits and agent wrappers (ugrep -I)
  # can answer "no match" entirely. That is a hole for line-based guardrails.
  no-nul-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: no raw NUL bytes in TypeScript sources or docs
        run: bun run lint:no-nul

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck

  # Schema migrations [spec:SP-4428]: drizzle-kit check fails when two branches
  # authored non-commutative migrations (touching the same table) — the merge
  # conflict our hand-rolled runner could never see. Also guards the bundled
  # manifest against drift (a migration added without regenerating it).
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: drizzle-kit check (cross-branch migration conflicts)
        run: bun run migration:check
      - name: bundled migration manifest is not stale
        run: bun run migration:manifest --check
      - name: expand-only migration audit
        run: bun run audit:expand-only

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      # Root unit scope: everything except apps/web and the integration/e2e/PTY
      # suites — see vitest.unit.config.ts for the exclusion convention.
      # Lane spec (drift guard): scripts/test-configuration.test.ts asserts the
      # unit/integration/agent-smoke lane split and package.json script shape.
      - name: unit tests (root vitest)
        run: bun run test:unit
      # apps/web needs happy-dom + its own aliases, so it runs under its own config.
      - name: unit tests (apps/web, happy-dom)
        # Use the same Turbo task as local agents so a future approved remote
        # cache can share this lane across CI jobs and worktrees.
        run: bun run test:web
      # Deterministic Ludovico-scale work/DOM budgets. Wall-clock values are
      # diagnostics only; the gates use cardinality and operation proxies.
      - name: large-state frontend benchmark
        run: bun run test:perf:frontend
      # bun-test unit subset: bun:sqlite-backed runtime store. The rest of
      # `test:bun` (compiled-daemon + lifecycle integration) stays out of CI.
      - name: unit tests (bun test)
        run: bun run test:bun:unit

  # Migration oracle [POD-295]: the process-spawning lanes (integration, e2e,
  # multi-instance). Together with unit-tests + typecheck above they are the
  # behavioral contract every rewrite phase must preserve — lane definitions live
  # in docs/agents/testing.md [spec:SP-0be7] and the lane set in scripts/oracle.ts
  # (`bun run oracle` runs all five locally; a drift guard keeps the two in sync).
  #
  # This job is the BACKSTOP, not the gate: work lands here by local ff-merge under
  # the merge lock, so the gate is a green `bun run oracle` on the candidate sha
  # (land-flow convention, docs/rearchitecture-v3.md). CI catches what slipped past.
  #
  # NEVER continue-on-error, and one lane per matrix leg: POD-744 is the cautionary
  # tale — biome + boundaries bundled under a single continue-on-error made an
  # architectural guardrail decorative, reporting green while exiting 1 for weeks.
  # A gate whose red is swallowed is worse than no gate; it launders the failure.
  #
  # The agent-smoke lane is deliberately absent: it launches real agent CLIs and
  # bills LLM quota, so it runs only as an explicit gate step where a phase touches
  # harness adapters.
  oracle:
    strategy:
      # One red lane must not cancel the others — a partial picture is how a
      # second failure hides behind the first.
      fail-fast: false
      matrix:
        lane: [integration, e2e, multi-instance]
    name: oracle (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # abduco backs the PTY/session layer these lanes exercise.
      - name: system deps (abduco)
        run: sudo apt-get update && sudo apt-get install -y abduco
      # The exception to --ignore-scripts above: node-pty's native addon must
      # exist for lanes that spawn real PTYs.
      - run: bun install --frozen-lockfile
      # No playwright install here on purpose: the e2e LANE is browser-free — it
      # is 7 vitest files under tests/e2e (verified: none of them, nor their
      # helpers, import playwright). The Playwright browser suite is
      # tests/e2e/browser/**.browser.e2e.ts under its own playwright.config.ts;
      # it runs in the `browser` job below (POD-1227), not here.
      - name: oracle lane
        run: bun run test:${{ matrix.lane }}

  # The browser lane [POD-1227]. 70 Playwright suites existed with no script and
  # no job: each ran once by hand when it was written and never again, while
  # "runtime verified" in handoffs and merge commits kept citing them.
  #
  # NON-BLOCKING ON PURPOSE, and unlike the lint bundle above this is not debt
  # being tolerated quietly — the first census (2026-07-31, recorded in
  # docs/agents/browser-lane-census.md) found a large red baseline, and a
  # required lane that red would stop every branch in the run. The value here is
  # the census the job PRINTS, not the badge it shows. Removing
  # continue-on-error is a follow-up issue, not this one; until then, read the
  # step output, never the checkmark.
  #
  # The POD-744 lesson still applies and is why this job is its own leg with one
  # step: nothing blocking may ever be folded in beside a swallowed red.
  browser:
    # One leg per Playwright project, because the config runs every suite against
    # all three (suites self-select with `test.skip(({ isMobile }) => …)`) and
    # `workers: 1` makes that strictly serial: the first census took ~10s per test
    # plus fixture overhead, which is hours in one leg and under an hour in three.
    strategy:
      # One red project must not cancel the others — the census is the point.
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-pixel, webkit-iphone]
    name: browser suites — ${{ matrix.project }} (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # abduco backs the PTY/session layer; the harness relay these suites drive
      # spawns real sessions, and node-pty's addon must exist — so, like the
      # oracle job, this installs WITH scripts.
      - name: system deps (abduco)
        run: sudo apt-get update && sudo apt-get install -y abduco
      - run: bun install --frozen-lockfile
      # The config declares chromium and webkit projects; both browsers plus
      # their OS deps have to be present or every suite errors on setup.
      - name: playwright browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: browser lane (non-blocking — see census doc)
        continue-on-error: true
        run: bun run test:browser --project=${{ matrix.project }}
      - name: upload playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-lane-results-${{ matrix.project }}
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
