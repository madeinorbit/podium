name: release
on:
  push:
    tags: ['v*']              # → stable headless assets only
  workflow_dispatch:          # → rolling edge headless assets only
permissions:
  contents: write
env:
  PODIUM_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'edge' || 'stable' }}
  PODIUM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && 'edge' || github.ref_name }}
concurrency:
  group: headless-release-${{ github.event_name == 'workflow_dispatch' && 'edge' || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: blacksmith-4vcpu-ubuntu-2204
          # The compiled daemon embeds a native abduco helper, so ARM64 builds on
          # GitHub's native ARM64 runner rather than cross-compiling an x64 helper.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            packages/agent-bridge/src/abduco.bin
          key: headless-${{ matrix.arch }}-${{ hashFiles('bun.lock') }}
      # --ignore-scripts: the compiled headless runtime uses Bun.Terminal and never
      # loads node-pty. esbuild ships a platform package; build-bun compiles abduco.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build signed ${{ matrix.arch }} headless artifact
        env:
          PODIUM_UPDATE_SIGNING_KEY: ${{ secrets.PODIUM_UPDATE_SIGNING_KEY }}
        run: bun scripts/release.ts --channel "$PODIUM_RELEASE_CHANNEL" --prepare-arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.arch }}
          path: dist-bun/release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - uses: actions/download-artifact@v4
        with:
          pattern: headless-*
          path: dist-bun/release
          merge-multiple: true
      - name: Publish one multi-architecture release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts --channel "$PODIUM_RELEASE_CHANNEL" --tag "$PODIUM_RELEASE_TAG" --publish-dir dist-bun/release

  published-smoke:
    name: published headless update smoke
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published assets and signature
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/verify-published-headless-update.sh "$PODIUM_RELEASE_TAG"
