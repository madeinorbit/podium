name: release
on:
  push:
    tags: ['v*']              # v0.2.0 → stable; v0.2.0-edge.1 → rolling edge
  workflow_dispatch:          # → rolling headless assets on the channel picked below
    inputs:
      channel:
        description: Rolling channel to publish headless assets onto
        required: true
        default: edge
        type: choice
        options:
          - edge
          # A build cut by hand to be installed and tried, onto the standing `dev` release
          # the desktop shell already publishes to [POD-3274]. It shares that tag and nothing
          # else: the asset names are disjoint, and a machine following the dev UPDATE channel
          # still takes its headless target from its own source server, never from here. So
          # `dev` here is a DOWNLOAD BASE for testing an install end to end, and publishing it
          # cannot move any machine that is already running.
          - dev
permissions:
  contents: write
# An -edge. prerelease tag publishes to the rolling `edge` release rather than minting a stable
# one, so the same tag drives the headless and desktop halves of one release to the same channel.
# Edge assets always live under the fixed `edge` tag — that URL is baked into shipped updaters.
env:
  # Pin the build caches back inside the checkout so actions/cache can name them as a
  # `path`. The defaults are durable and outside the checkout (POD-3162), which is what a
  # developer box and a /tmp release worktree need and what an ephemeral runner cannot use.
  # The abduco cache holds the abduco ATTACH CLIENT, kept only to adopt sessions started
  # by older releases (POD-4986); nothing spawns on abduco.
  PODIUM_ABDUCO_CACHE_DIR: dist-bun/abduco-cache
  PODIUM_RUST_HOST_CACHE_DIR: dist-bun/rust-host-cache
  # `inputs.channel` is a required choice with a default, so it is never the empty string and
  # cannot trip the Actions ternary bug the desktop workflow documents. A rolling channel's TAG
  # is its own name; only stable is told a tag, and its tag is the ref that triggered it.
  PODIUM_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || (contains(github.ref_name, '-edge.') && 'edge' || 'stable') }}
  PODIUM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || (contains(github.ref_name, '-edge.') && 'edge' || github.ref_name) }}
concurrency:
  group: headless-release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || (contains(github.ref_name, '-edge.') && 'edge' || github.ref_name) }}
  cancel-in-progress: false
jobs:
  # ONE LINUX JOB, FOUR PLATFORMS [spec:SP-6144 section 8b].
  #
  # This used to be a matrix — x64 on Blacksmith Ubuntu, arm64 on a native ARM runner —
  # because the compiled daemon embeds native helpers and each helper had to be built on
  # the architecture that would run it. Everything native a bundle ships is now built for
  # every target from here: podium-host and podium-tunnel by cargo-zigbuild, and the
  # embedded abduco attach client by `zig cc`.
  # `rcodesign` does not add the Darwin signature — `bun build --compile` already emits
  # an ad-hoc LINKER_SIGNED Mach-O (identifier a.out). rcodesign REPLACES
  # that with identifier podium plus the five Bun JIT entitlement keys. Drop rcodesign
  # and the binary still "signs"; what breaks is JIT, at runtime. Adding both Darwin
  # platforms costs one more compile each, not one more runner each.
  headless:
    name: cross-build all headless platforms
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: /tmp/podium-cache/podium/turbo
    steps:
      - uses: actions/checkout@v4
      # zig links the Rust binaries (cargo-zigbuild) and compiles the abduco attach client.
      # rcodesign re-signs Darwin Mach-Os with
      # Bun's JIT entitlements — it does not add the signature (Bun already did).
      # All tool versions come from mise.toml — the one pin site dev machines share.
      # That includes pigz, the parallel compressor for the release tarballs (optional at
      # build time; scripts/parallel-gzip.ts falls back to gzip if it is missing).
      - uses: jdx/mise-action@v2
      # The Rust host owns a newer Rust pin than podium-tunnel. Install from its
      # crate configuration; rust-host-cross selects that channel explicitly.
      - name: Install Rust host toolchain
        run: |
          mise trust packages/pty/vendor/podium-host/mise.toml
          mise -C packages/pty/vendor/podium-host install rust
      # The build caches are content-addressed on their sources, so these keys are the
      # honest ones: touch abduco.c, or the Rust crate, its pins or its build script, and
      # every platform's binary for that source is rebuilt. PODIUM_*_CACHE_DIR pins them
      # back inside the checkout: locally the defaults are durable per-repository paths
      # outside it (POD-3162), which buy nothing on an ephemeral runner and cannot be named
      # by an actions/cache `path`.
      - uses: actions/cache@v4
        with:
          path: dist-bun/abduco-cache
          key: abduco-cross-${{ hashFiles('packages/pty/vendor/abduco/abduco.c') }}
      - uses: actions/cache@v4
        with:
          path: dist-bun/rust-host-cache
          key: rust-host-cross-${{ hashFiles('mise.toml', 'scripts/rust-host-cross.ts', 'packages/pty/vendor/podium-host/**') }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: headless-cross-${{ hashFiles('bun.lock') }}
      # The client build cache (POD-3053). `release:prepare` builds web and mobile ONCE
      # for the whole platform set through scripts/build-clients.ts; with this restored,
      # a re-run for a commit CI has already built restores both instead. Same key shape
      # as the ci.yml typecheck lane, with its own task suffix so the two never evict
      # each other, and the same fall-back ladder: this SHA, then any build entry on
      # this ref, then any entry for this lockfile.
      - uses: actions/cache@v4
        with:
          path: /tmp/podium-cache/podium/turbo
          key: turbo-${{ runner.os }}-bun-${{ hashFiles('mise.toml') }}-${{ hashFiles('bun.lock') }}-${{ github.ref_name }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-bun-${{ hashFiles('mise.toml') }}-${{ hashFiles('bun.lock') }}-${{ github.ref_name }}-build-
            turbo-${{ runner.os }}-bun-${{ hashFiles('mise.toml') }}-${{ hashFiles('bun.lock') }}-
      # --ignore-scripts: the compiled headless runtime uses Bun.Terminal and never
      # loads node-pty. esbuild ships a platform package.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build four signed headless bundles
        env:
          PODIUM_UPDATE_SIGNING_KEY: ${{ secrets.PODIUM_UPDATE_SIGNING_KEY }}
        # --record: the build ledger's client half, uploaded with the assets so a
        # release page's provenance -- which client build, restored or rebuilt, under
        # which Turbo hashes -- survives the runner it was produced on.
        run: bun run release:prepare -- --channel "$PODIUM_RELEASE_CHANNEL" --record dist-bun/release/record
      # Interrogate what will actually be uploaded, not the build tree it came from.
      # A wrong-architecture helper, a lost Darwin signature or a stub binary fails HERE,
      # before anything reaches a release page.
      - name: Assert every bundle is what it claims to be
        run: |
          set -euo pipefail
          HASH="$(bun -e 'import{abducoSourceHash}from"./scripts/abduco-cross.ts";console.log(abducoSourceHash().slice(0,16))')"
          for pair in "linux-x86_64:linux-x64" "linux-aarch64:linux-arm64" \
                      "darwin-aarch64:darwin-arm64" "darwin-x86_64:darwin-x64"; do
            platform="${pair%%:*}"; asset="${pair##*:}"
            bash scripts/assert-headless-bundle.sh \
              "dist-bun/release/podium-headless-${asset}.tar.gz" "$platform" \
              --source-commit "$GITHUB_SHA" \
              --abduco "dist-bun/abduco-cache/${platform}-${HASH}"
          done
      # RUN the one bundle this runner can run, BEFORE publishing it. Everything above
      # interrogates tarballs without executing anything — the only option for the three
      # platforms a Linux x64 runner cannot run, and no excuse at all for the fourth. A
      # bundle that passes every static check and then fails to start is precisely the
      # regression cross-compilation introduces. The published smoke does run it, but
      # only after publication, which is too late to stop.
      - name: Run the cross-built linux-x64 bundle
        run: bash scripts/smoke-headless-bundle.sh dist-bun/release/podium-headless-linux-x64.tar.gz
      # PROVE THE GATE ABOVE CAN SAY NO, on every release, rather than remembering that
      # it once could. A green from a check that cannot go red is a claim nobody made —
      # and this harness earned its place immediately: its first run found that the
      # entitlement check had never been exercised by anything.
      #
      # It compiles one throwaway Darwin binary, which is a SECOND darwin compile in this
      # job. Measured on this hardware: 0.68 s and 67 MB, deleted straight after. It buys the only
      # honest test of the "was this re-signed, or is it still Bun's linker signature?"
      # discriminator — no cheaper substitute produces a genuine LINKER_SIGNED binary,
      # and re-signing the shipped one with a different identifier would prove a
      # different check. Kept deliberately, at a cost that is a rounding error next to
      # the four real compiles above.
      - name: Prove the bundle assertions can fail
        run: |
          bash scripts/prove-headless-assertions-can-fail.sh \
            dist-bun/release/podium-headless-darwin-arm64.tar.gz \
            dist-bun/release/podium-headless-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: headless-cross
          path: dist-bun/release/*
          if-no-files-found: error

  publish:
    needs: [headless]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: bun
      # The stable bridge proof runs the privileged real-release lane against the
      # prepared bytes. It skips the target build, but still packages the lane's
      # isolated coordinator and therefore needs the checkout-local release
      # toolchain. Edge never executes these setup steps or the proof.
      - uses: jdx/mise-action@v2
        if: env.PODIUM_RELEASE_CHANNEL == 'stable'
      - uses: dtolnay/rust-toolchain@stable
        if: env.PODIUM_RELEASE_CHANNEL == 'stable'
      # EVERY CHANNEL, not just stable (POD-4507). This step used to be the stable
      # proof's prerequisite and carried that `if:`. But the publish step below is
      # `bun scripts/release.ts`, and that import graph reaches `zod` through
      # packages/protocol/src/update/target.ts, so on edge and dev it ran with no
      # node_modules at all and died before it opened a single artifact. Nobody saw
      # it because `publish` then also waited on the temporary cross-vs-native A/B
      # (retired in POD-4789), which had failed on every run since v0.1.0 — the job
      # was skipped, not passing.
      - name: Install the release toolchain's own dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Ensure the real-release base image is available
        if: env.PODIUM_RELEASE_CHANNEL == 'stable'
        run: docker pull ubuntu:24.04
      - name: Build the locked desktop signature verifier
        if: env.PODIUM_RELEASE_CHANNEL == 'stable'
        run: >-
          cargo build --release --locked
          --manifest-path scripts/stable-candidate-minisign/Cargo.toml
      - uses: actions/download-artifact@v4
        with:
          name: headless-cross
          path: dist-bun/release
      # PUBLISHING IS ONE ACT (POD-2796). Most headless releases mint no shell, so the
      # previous release's `latest.json` has to come forward onto this one or installed
      # desktop apps lose the endpoint they poll. This used to be `gh release download
      # … || true`, which put "this channel has no previous release" and "GitHub could
      # not be reached" into the same silent catch — and a stable cut is a NEW release,
      # so nothing carried means `releases/latest/download/latest.json` starts 404ing
      # for every shell already installed, while the run reports success. The script
      # asks what the standing release holds and lets only a clean 404 mean "nothing to
      # carry"; every other answer fails this step and the publish below never runs.
      - name: Carry forward the standing desktop shell reference
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/carry-forward-desktop-manifest.ts --channel "$PODIUM_RELEASE_CHANNEL" --dir dist-bun/release
      # POD-2789 owns making this a complete, fail-closed pair. This issue starts
      # exactly after that boundary: release.ts writes the final headless manifest
      # without GH_TOKEN, then a byte-for-byte published v0.1.0 install must accept
      # the complete candidate before any release create/upload can run.
      - name: Prepare the complete stable candidate
        if: env.PODIUM_RELEASE_CHANNEL == 'stable'
        run: bun scripts/release.ts --channel stable --tag "$PODIUM_RELEASE_TAG" --publish-dir dist-bun/release
      - name: Seal the stable candidate bytes
        if: env.PODIUM_RELEASE_CHANNEL == 'stable'
        run: |
          snapshot="$RUNNER_TEMP/stable-release-candidate.json"
          bun scripts/release-candidate-snapshot.ts \
            --dir dist-bun/release --write "$snapshot"
          echo "PODIUM_RELEASE_CANDIDATE_SNAPSHOT=$snapshot" >>"$GITHUB_ENV"
      - name: Prove the stable candidate from published v0.1.0
        if: env.PODIUM_RELEASE_CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${PODIUM_RELEASE_TAG#v}"
          PODIUM_UPDATE_E2E_ONLY=real-release \
          PODIUM_UPDATE_E2E_REAL_TARGET_DIR="$GITHUB_WORKSPACE/dist-bun/release" \
          PODIUM_UPDATE_E2E_REAL_TARGET_VERSION="$version" \
          PODIUM_UPDATE_E2E_REAL_DESKTOP_VERIFIER="$GITHUB_WORKSPACE/scripts/stable-candidate-minisign/target/release/podium-stable-candidate-minisign" \
          PODIUM_UPDATE_E2E_OUTPUT_DIR="$RUNNER_TEMP/stable-bridge-evidence" \
            bash scripts/docker-update-e2e.sh
      - name: Preserve stable bridge proof evidence
        if: always() && env.PODIUM_RELEASE_CHANNEL == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: stable-bridge-proof
          path: ${{ runner.temp }}/stable-bridge-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Publish one multi-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts --channel "$PODIUM_RELEASE_CHANNEL" --tag "$PODIUM_RELEASE_TAG" --publish-dir dist-bun/release

  published-smoke:
    name: published headless update smoke
    needs: publish
    # NOT RUN FOR `dev`, and that is the channel's semantics rather than a gap. The smoke
    # drives a daemon at PODIUM_UPDATE_CHANNEL=dev, whose feed is a source server's own
    # (release-target.ts) — there is no GitHub feed for it to find, so the check could only
    # be waived, and a waived check reads as a pass. What dev publishes IS verified: the
    # signature and asset checks in `publish` are channel-independent.
    # `env` is not in scope for a job-level `if`, so this reads the input directly.
    if: github.event_name != 'workflow_dispatch' || inputs.channel != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: bun
      # The published smoke opens the Darwin bundles it cannot execute, so it needs the
      # Mach-O signature reader — and zig, to rebuild the reference abduco attach clients
      # it checks the published binaries against. Without those references the
      # embedded-client check could only be waived, and a waived check reads as a pass.
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: dist-bun/abduco-cache
          key: abduco-cross-${{ hashFiles('packages/pty/vendor/abduco/abduco.c') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify the published assets and signature
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/verify-published-headless-update.sh "$PODIUM_RELEASE_TAG"
