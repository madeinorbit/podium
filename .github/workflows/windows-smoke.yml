# Windows headless gate (#90): proves the ConPTY PTY backend works at runtime and
# that the headless bundle builds AND boots on Windows [spec:SP-7f2c]. The release
# matrix (#35) can hang its Windows row off this.
name: windows-smoke
#
# Windows is experimental and not built by default, so this no longer runs on every push to
# main: a platform we are not shipping yet should not paint main red. Dispatch it when working
# on Windows, and put the push trigger back when Windows becomes a platform we ship.
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: D:\p
    steps:
      - uses: actions/checkout@v4
      # NSIS opens payload files through legacy Windows path APIs. Metro asset names
      # can exceed MAX_PATH under the Actions checkout root, so build from a short,
      # independent checkout before installing any dependencies.
      - name: Prepare short Windows build path
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git clone --no-hardlinks --no-checkout "$env:GITHUB_WORKSPACE" D:\p
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C D:\p checkout --detach $env:GITHUB_SHA
          exit $LASTEXITCODE
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: ConPTY support needs >= 1.3.14, and a '1.3' range has been seen
          # resolving to 1.3.0 (release.yml pins for the same reason).
          bun-version: '1.3.14'
      # Bun's global virtual store is not a directory of its own: it is `links/` INSIDE the
      # install cache, and every node_modules/.bun/<pkg> entry is a symlink into it. On
      # windows-latest the cache defaults to C:\Users\runneradmin\.bun\install\cache while the
      # checkout is on D:, so each of those links would cross a volume. Put the cache — and so
      # the store — on the checkout's own volume. The global store stays fully in use; this
      # only decides where it lives, which is why it is not a Windows linker override.
      # Keep its name short too: Metro embeds this path into exported asset names.
      - name: Pin Bun's install cache (and its global store) to the checkout volume
        shell: pwsh
        run: |
          $cache = 'D:\b'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "BUN_INSTALL_CACHE_DIR=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "workspace volume: $((Split-Path -Qualifier $env:GITHUB_WORKSPACE))"
          Write-Host "cache volume:     $((Split-Path -Qualifier $cache))  ($cache)"
      # Diagnostic, not a gate: records what this runner actually permits, so a future failure
      # can be read against the privileges rather than guessed at.
      - name: Probe symlink privilege and volume layout
        shell: pwsh
        continue-on-error: true
        run: |
          whoami /priv | Select-String 'SymbolicLink'
          $dev = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          Write-Host "AllowDevelopmentWithoutDevLicense: $((Get-ItemProperty -Path $dev -ErrorAction SilentlyContinue).AllowDevelopmentWithoutDevLicense)"
          foreach ($t in @($env:GITHUB_WORKSPACE, $env:USERPROFILE)) {
            $link = Join-Path $env:BUN_INSTALL_CACHE_DIR ("probe-" + (Split-Path -Qualifier $t).TrimEnd(':'))
            try {
              New-Item -ItemType SymbolicLink -Path $link -Target $t -ErrorAction Stop | Out-Null
              Write-Host "symlink to $t : OK"; Remove-Item $link -Force
            } catch { Write-Host "symlink to $t : FAILED - $($_.Exception.Message)" }
          }
      # Do not archive/restore Bun's Windows global link store: a restored archive
      # produced dangling package links and was refused by build admission. Each
      # disposable runner creates its own store and checkout-local links instead.
      # No package lifecycle hook is required for the Bun/ConPTY runtime.
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: ConPTY runtime smoke (spawn → write/exec → resize → exit)
        run: bun --conditions=@podium/source scripts/conpty-smoke.ts

      # Preview installers are CI artifacts only: no release or updater feed is changed.
      - name: Build Windows preview installer and headless bundle
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'tauri-preview.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $config -Encoding utf8
          bun run --cwd apps/desktop build -- --bundles nsis --config $config

      - name: Payload regression tests on Windows
        run: cargo test --release --manifest-path apps/desktop/src-tauri/Cargo.toml --bin Podium payload

      - name: Installed desktop starts its own payload
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installDir = 'D:\Podium App'
          $setup = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S',"/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited $($setup.ExitCode)" }
          $executable = Join-Path $installDir 'Podium.exe'
          if (-not (Test-Path $executable)) { throw 'Installed desktop executable is missing' }
          $env:PODIUM_STATE_DIR = 'D:\podium-state'
          $env:PODIUM_PAYLOAD_HOME = 'D:\podium-payload'
          $env:PODIUM_INSTANCE = 'windows-preview'
          $env:PODIUM_NO_RELAY = '1'
          $env:PODIUM_ADOPT_STATE = '1'
          $env:PODIUM_PORT = '18787'
          New-Item -ItemType Directory -Force $env:PODIUM_STATE_DIR | Out-Null
          @{ mode = 'all-in-one'; port = 18787 } | ConvertTo-Json -Compress |
            Set-Content (Join-Path $env:PODIUM_STATE_DIR 'config.json') -Encoding utf8
          $desktop = Start-Process -FilePath $executable -WorkingDirectory $env:RUNNER_TEMP -PassThru
          $nativeLog = Join-Path $env:PODIUM_STATE_DIR 'logs/desktop-native.ndjson'
          try {
            $healthy = $false
            foreach ($i in 1..90) {
              if ($desktop.HasExited) { throw 'Installed desktop exited before its payload became healthy' }
              if (Select-String -Path $nativeLog -Pattern 'payload spawn failed|payload seed failed|payload is not executable|window build failed' -Quiet -ErrorAction SilentlyContinue) {
                throw 'Installed desktop reported a payload or window failure'
              }
              try {
                $health = Invoke-WebRequest 'http://127.0.0.1:18787/health' -UseBasicParsing -TimeoutSec 2
                if ($health.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) { throw 'The installed desktop did not start a healthy payload' }
            if (-not (Test-Path (Join-Path $env:PODIUM_PAYLOAD_HOME 'podium-cli.exe'))) { throw 'Windows payload executable was not seeded' }
            if (-not (Select-String -Path $nativeLog -Pattern 'native backend initial host spawn succeeded' -Quiet)) { throw 'Desktop payload spawn was not observed' }
            $version = Invoke-WebRequest 'http://127.0.0.1:18787/version' -UseBasicParsing
            Write-Host "Installed payload version: $($version.Content)"
            Start-Sleep -Seconds 5
            if ($desktop.HasExited) { throw 'Installed desktop exited after payload startup' }
          } finally {
            Get-Content $nativeLog -ErrorAction SilentlyContinue
            taskkill /PID $desktop.Id /T /F 2>$null | Out-Null
          }
          exit 0

      - name: Record installer checksum and source
        shell: pwsh
        run: |
          $bundle = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem "$bundle/*-setup.exe")
          if ($installers.Count -ne 1) { throw "Expected one Windows installer, found $($installers.Count)" }
          $hash = Get-FileHash $installers[0].FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installers[0].Name)" | Set-Content "$bundle/SHA256SUMS.txt"
          @(
            'Podium Windows x64 preview installer',
            "Source commit: $env:GITHUB_SHA",
            "Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            'Extract this archive and run the -setup.exe installer.',
            'This experimental installer is not Authenticode-signed. Windows may show an unknown-publisher warning.',
            'This build is a CI artifact, not a published release or updater promotion.'
          ) | Set-Content "$bundle/README.txt"

      - name: Upload Windows preview installer
        uses: actions/upload-artifact@v4
        with:
          name: podium-windows-x64-preview-${{ github.run_number }}
          path: |
            D:/p/apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            D:/p/apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            D:/p/apps/desktop/src-tauri/target/release/bundle/nsis/README.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
