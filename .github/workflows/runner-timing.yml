# TEMPORARY [POD-3159]. Delete once the Blacksmith-vs-GitHub decision is made.
#
# Measures runner speed honestly: the same steps, on the same commit, at the same time, on both
# providers. It does NOT reuse the historical desktop-release timings as a baseline — those came
# from different commits with different caches, which is exactly the comparison that misleads.
#
# Signing and notarization are omitted deliberately. Notarization is a network round-trip to
# Apple, so it measures Apple's queue rather than the runner; every other step here is identical
# across the two providers, which is what makes the difference attributable to the hardware.
#
# It publishes nothing and uploads nothing, and its concurrency group is its own, so it cannot
# collide with the desktop-release `dev` slot that other issues share.
name: runner timing

on:
  push:
    branches: ['issue/3159-since-we-are-a-public-repo-on-github-git']
  workflow_dispatch:

concurrency:
  group: runner-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timing:
    name: ${{ matrix.target }} on ${{ matrix.provider }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            provider: github
            runner: ubuntu-latest
            build_args: ""
          - target: linux-x86_64
            provider: blacksmith
            runner: blacksmith-4vcpu-ubuntu-2204
            build_args: ""
          - target: darwin-aarch64
            provider: github
            runner: macos-15
            build_args: "-- --target aarch64-apple-darwin"
          - target: darwin-aarch64
            provider: blacksmith
            runner: blacksmith-6vcpu-macos-15
            build_args: "-- --target aarch64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Record runner hardware
        run: |
          echo "provider=${{ matrix.provider }} runner=${{ matrix.runner }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "cpus=$(sysctl -n hw.ncpu) model=$(sysctl -n machdep.cpu.brand_string)"
            echo "memGB=$(( $(sysctl -n hw.memsize) / 1073741824 ))"
          else
            echo "cpus=$(nproc) model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
            echo "memGB=$(( $(grep MemTotal /proc/meminfo | awk '{print $2}') / 1048576 ))"
          fi
          df -h . | tail -1

      # Both providers use the upstream actions here. The Blacksmith wrappers exist to make their
      # cache faster, so using them would fold a cache-layer difference into what is meant to be a
      # CPU comparison. The cache is cold on both sides anyway — see the key below.
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }

      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev

      # A per-provider key, so neither leg can be handed a cache the other populated. Both legs
      # therefore do the same cold work, which is the only way the numbers compare.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            packages/agent-bridge/src/abduco.bin
          key: runner-timing-${{ matrix.provider }}-${{ matrix.target }}-${{ github.run_id }}

      - name: Timed - bun install
        run: |
          start=$(date +%s)
          bun install --frozen-lockfile --ignore-scripts
          echo "PHASE_INSTALL=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # The Developer ID has to be imported even though this workflow ships nothing: an empty
      # APPLE_SIGNING_IDENTITY does NOT put Tauri into an unsigned mode — it still runs codesign
      # and dies with "The specified item could not be found in the keychain". Both macOS legs do
      # this identically, so it stays a fair comparison; it costs a couple of seconds either side.
      - name: Import Developer ID certificate
        if: startsWith(matrix.target, 'darwin-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/podium-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$cert"

      # Signs but does NOT notarize: notarization is gated on APPLE_API_KEY/APPLE_API_ISSUER,
      # which are deliberately absent here because that step measures Apple's queue, not the CPU.
      - name: Timed - desktop build
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.target, 'darwin-') && secrets.APPLE_TEAM_ID || '' }}
          # Required on EVERY platform, not just macOS: tauri.conf.json carries an updater public
          # key, and the bundler refuses with "A public key has been found, but no private key"
          # when the matching secret is absent — which is what failed the first Linux attempt.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PODIUM_DESKTOP_RELEASE_CHANNEL: dev
        run: |
          start=$(date +%s)
          bun run --cwd apps/desktop build ${{ matrix.build_args }}
          echo "PHASE_BUILD=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Remove signing credentials
        if: always() && startsWith(matrix.target, 'darwin-')
        run: |
          security delete-keychain "$RUNNER_TEMP/podium-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Report
        if: always()
        run: |
          {
            echo "### ${{ matrix.target }} on ${{ matrix.provider }} (\`${{ matrix.runner }}\`)"
            echo ""
            echo "| phase | seconds |"
            echo "| --- | --- |"
            echo "| bun install | ${PHASE_INSTALL:-n/a} |"
            echo "| desktop build | ${PHASE_BUILD:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TIMING ${{ matrix.provider }} ${{ matrix.target }} install=${PHASE_INSTALL:-n/a}s build=${PHASE_BUILD:-n/a}s"
